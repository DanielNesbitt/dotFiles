# Per-machine package extras, keyed by `.chezmoi.hostname`. Installed on top
# of the common lists in packages.yaml.
machines:
  tyr:
    brew:
      - yt-dlp
      - ollama
  thor:
    pacman: []
  GEN-FLASH:
    pacman:
      - glab
      - opencode
      - postgresql
    # 1Password reference for the GPG passphrase; enables pinentry-op when set.
    gpg_passphrase_ref: op://Employee/GPG Pass/password
