"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](bright-black)\
$directory\
[](bright-black bg:green)\
$git_branch\
$git_status\
[](green)\
"""

right_format = """
$status$cmd_duration$time"""

[directory]
style = "bg:bright-black fg:bright-white"
format = "[ $path ]($style)"
fish_style_pwd_dir_length = 1
truncate_to_repo = false
truncation_length = 99

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bold bg:green fg:black"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bold bg:green fg:black"
format = "[ $all_status$ahead_behind ]($style)"

[status]
disabled = false
style = "fg:red"
format = "[$symbol$status ]($style)"
symbol = "✖"

[cmd_duration]
min_time = 2000
style = "fg:bright-black"
format = "[$duration ]($style)"

[time]
disabled = false
time_format = "%a %b %d %T"
style = "fg:bright-black"
format = "[ $time]($style)"

[username]
disabled = true

[hostname]
disabled = true
